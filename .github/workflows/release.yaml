name: Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  release-container:
    uses: radiorabe/actions/.github/workflows/release-container.yaml@953c51da7e4c2c681f15c70513cb803c8fa461cc # v0.44.3
    with:
      image: ghcr.io/radiorabe/acrmonitoring
      name: acrmonitoring
      display-name: Analyse ACRCloud data dumps and generate events for Zabbix
      tags: minimal rhel9 ubi9 rabe minio kafka cloudevents acrcloud
  mkdocs:
    uses: radiorabe/actions/.github/workflows/release-mkdocs.yaml@953c51da7e4c2c681f15c70513cb803c8fa461cc # v0.44.3
