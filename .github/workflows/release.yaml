name: Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  release-container:
    uses: radiorabe/actions/.github/workflows/release-container.yaml@c26933dd78f0f76b51d1e3bb80ac099bfe0ee89b # v0.45.0
    with:
      image: ghcr.io/radiorabe/acrmonitoring
      name: acrmonitoring
      display-name: Analyse ACRCloud data dumps and generate events for Zabbix
      tags: minimal rhel9 ubi9 rabe minio kafka cloudevents acrcloud
  mkdocs:
    uses: radiorabe/actions/.github/workflows/release-mkdocs.yaml@c26933dd78f0f76b51d1e3bb80ac099bfe0ee89b # v0.45.0
